services:
  - type: worker
    name: mythics-gathering-bets-bot
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    # A background worker stays awake around the clock so the bot is always
    # there to take guesses and settle bets. Workers are not on Render's
    # free tier.
    plan: starter
    # Persistent disk: bets, guesses, and scores live in a JSON file, so the
    # data file must survive restarts and redeploys. The disk is mounted at
    # /data and BETS_DB_PATH points there.
    disk:
      name: bets-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BETS_DB_PATH
        value: /data/bets.json
      # Set these three in the Render dashboard (never in this file):
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
